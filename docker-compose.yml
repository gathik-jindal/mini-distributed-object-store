name: dos

x-worker: &worker
  build: .
  image: dos:latest
  command: ["worker"]
  restart: unless-stopped   # a manual `docker stop worker2` still keeps it down
  depends_on:
    controller:
      condition: service_started
  environment: &worker-env
    PORT: "9000"
    CONTROLLER_URL: http://controller:8000
    DATA_DIR: /data
    HEARTBEAT_INTERVAL: "2"
    SCRUB_INTERVAL: "60"
  expose: ["9000"]          # internal only: clients never talk to workers
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  controller:
    build: .
    image: dos:latest
    container_name: controller
    command: ["controller"]
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DB_PATH: /data/meta.db
      CHUNK_SIZE: "1048576"
      REPLICATION_FACTOR: "2"
      SUSPECT_AFTER: "5"
      DEAD_AFTER: "10"
      REPAIR_GRACE: "20"
      REPAIR_INTERVAL: "5"
    volumes: ["controller-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker1:
    <<: *worker
    container_name: worker1
    hostname: worker1
    environment: { <<: *worker-env, WORKER_ID: worker1, WORKER_URL: "http://worker1:9000" }
    volumes: ["worker1-data:/data"]
  worker2:
    <<: *worker
    container_name: worker2
    hostname: worker2
    environment: { <<: *worker-env, WORKER_ID: worker2, WORKER_URL: "http://worker2:9000" }
    volumes: ["worker2-data:/data"]
  worker3:
    <<: *worker
    container_name: worker3
    hostname: worker3
    environment: { <<: *worker-env, WORKER_ID: worker3, WORKER_URL: "http://worker3:9000" }
    volumes: ["worker3-data:/data"]
  worker4:
    <<: *worker
    container_name: worker4
    hostname: worker4
    environment: { <<: *worker-env, WORKER_ID: worker4, WORKER_URL: "http://worker4:9000" }
    volumes: ["worker4-data:/data"]

  # client container: `docker compose run --rm client <dosctl args>`
  client:
    image: dos:latest
    profiles: ["client"]
    entrypoint: ["dosctl"]
    environment:
      DOS_URL: http://controller:8000
    working_dir: /work
    volumes: ["./samples:/work"]
    depends_on: [controller]

volumes:
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:
